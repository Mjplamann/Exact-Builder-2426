name: Refresh data

# Fetches every public source, recomputes the pulse/projections, commits public/data/,
# and (on the default branch) redeploys the site to GitHub Pages.
on:
  schedule:
    # Every 3 hours. Most sources update weekly (CDC Wed/Fri, MDH Thu 11am CT); frequent runs
    # pick up each release within a few hours.
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated source ids to refresh (blank = all)'
        required: false
  push:
    branches: ['**']
    paths: ['pipeline/**', 'shared/**', '.github/workflows/refresh-data.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache immutable downloads
        uses: actions/cache@v4
        with:
          path: pipeline/.cache
          key: pipeline-cache-${{ github.run_id }}
          restore-keys: pipeline-cache-
      - name: Run pipeline
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          DELPHI_API_KEY: ${{ secrets.DELPHI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            npx tsx pipeline/run.ts --only=${{ github.event.inputs.only }}
          else
            npx tsx pipeline/run.ts
          fi
      - name: Commit refreshed data
        run: |
          git config user.name "mn-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          # Commit only when observations changed (pulse/manifest timestamps alone are not worth a commit;
          # the deployed site is still rebuilt from this run's files).
          if git diff --cached --quiet -- public/data/series; then
            echo "No new observations."
            git reset -q
          else
            git commit -m "Data refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((i * 5))
            done
          fi
      - name: Build site
        if: github.ref_name == github.event.repository.default_branch
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Upload Pages artifact
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: refresh
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
